    К-730  x=530 w=50
    К-858  x=580 w=50
    К-859  x=630 w=50
    К-711  x=680 w=50
    К-887  x=730 w=50
    К-871  x=780 w=50
    К-882  x=830 w=50
    К-42   x=880 w=50
    Метки 103/64 стопкой x=930 w=25: 103 h=62, 64 h=63
    Метка 104 x=955 w=25 h=125 (только нижний ряд)
    
    Итого ширина: 5+25+50×18+25+25 = 5+25+900+25+25 = 980 → w=990
