  <!--
    1 кл = 25px
    Стандарт: 2кл×5кл = 50×125
    Высота ряда = 125px
    Верхний ряд: y=20, h=125  (основной)
    Поднятый блок (К-417, К-838, К-839): y=5, h=140  (выше на 15px)
    Нижний ряд: y=195, h=125  (сразу под верхним, но со смещением)

    ВЕРХНИЙ РЯД структура (слева направо):
    19  x=5   w=25  h=125  (число-метка, 1кл)
    29  x=5   w=25  h=62   (стопка верх)  - нет, это разные числа
    
    Левый блок чисел — стопка 19/29/17/16/15 = 5 меток узких (1кл=25px)
    
    ВЕРХНИЙ РЯД (y=20, h=125):
    Метки 19/29 стопкой: x=5, w=25, 19 h=62, 29 h=63
    К-493  x=30  w=50
    К-268  x=80  w=50
    К-420  x=130 w=50
    К-405  x=180 w=50
    К-406  x=230 w=50
    [ПОДНЯТЫЙ БЛОК y=5 h=140]:
    К-417  x=280 w=50
    К-838  x=330 w=50
    К-839  x=380 w=50
    [конец поднятого]
    К-841  x=430 w=50
    К-336  x=480 w=50
    К-348  x=530 w=50
    К-346  x=580 w=50
    К-350  x=630 w=50
    К-335  x=680 w=50
    К-334  x=730 w=50
    К-366  x=780 w=50
    К-365  x=830 w=50
    К-118  x=880 w=50
    [правая метка 104 снизу]

    НИЖНИЙ РЯД (y=195, h=125 но делится):
    Метки 17/16/15 стопкой x=5 w=25: 17 h=42, 16 h=42, 15 h=41
    К-771  x=30  w=50
    К-821  x=80  w=50
    К-776  x=130 w=50
    К-775  x=180 w=50
    К-598  x=230 w=50
