<svg width="230" height="580" viewBox="0 0 230 580" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!--
    Исправленная структура по скрину:
    Левая колонка: x=5, w=70 (более узкая)
    Правая колонка: x=75, w=85 (более широкая)
    
    70: только левая колонка
    48 | 49: две колонки
    94: полная ширина (обе колонки)
    30 | 41, 31 | 40: две колонки
    только 39: правая колонка
    32 | 38, 33 | 37, 34 | 36, 35 | П.Г.: две колонки
    24: только левая колонка
  -->

  <rect width="230" height="580" fill="#DAE5DF"/>

  <!-- 70: только левая -->
  <rect x="5"   y="20"  width="70"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="40"  y="45"  font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">70</text>

  <!-- 48 | 49 -->
  <rect x="5"   y="70"  width="70"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="40"  y="95"  font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">48</text>
  
  <rect x="75"  y="70"  width="85"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="117" y="95"  font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">49</text>

  <!-- 94: полная ширина -->
  <rect x="5"   y="120" width="155" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="82"  y="145" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">94</text>

  <!-- 30 | 41 -->
  <rect x="5"   y="170" width="70"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="40"  y="195" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">30</text>
  
  <rect x="75"  y="170" width="85"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="117" y="195" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">41</text>

  <!-- 31 (двойная высота) | 40 -->
  <rect x="5"   y="220" width="70"  height="100" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="40"  y="270" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">31</text>
  
  <rect x="75"  y="220" width="85"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="117" y="245" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">40</text>

  <!-- только 39 справа -->
  <rect x="75"  y="270" width="85"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="117" y="295" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">39</text>

  <!-- 32 | 38 -->
  <rect x="5"   y="320" width="70"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="40"  y="345" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">32</text>
  
  <rect x="75"  y="320" width="85"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="117" y="345" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">38</text>

  <!-- 33 | 37 -->
  <rect x="5"   y="370" width="70"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="40"  y="395" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">33</text>
  
  <rect x="75"  y="370" width="85"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="117" y="395" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">37</text>

  <!-- 34 | 36 -->
  <rect x="5"   y="420" width="70"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="40"  y="445" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">34</text>
  
  <rect x="75"  y="420" width="85"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="117" y="445" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">36</text>

  <!-- 35 | П.Г. -->
  <rect x="5"   y="470" width="70"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="40"  y="495" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">35</text>
  
  <rect x="75"  y="470" width="85"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="117" y="495" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П.Г.</text>

  <!-- 24: одиночный слева -->
  <rect x="5"   y="520" width="70"  height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="40"  y="545" font-size="14" fill="#29332D" text-anchor="middle" dominant-baseline="middle">24</text>

</svg>