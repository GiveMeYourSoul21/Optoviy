<svg width="915" height="310" viewBox="0 0 915 310" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!--
    1 кл = 25px
    Стандарт: 2кл×5кл = 50×125
    Широкий 4кл: 100×125
    Ряды вплотную:
      Верхний ряд: y=20, h=125
      Нижний ряд:  y=145, h=125

    ВЕРХНИЙ РЯД:
    Стопка 3шт x=5 w=100: П-559(h=42) К-328(h=41) К-327(h=42)
    П-471 x=105 w=100
    П-470 x=205 w=100
    П-469 x=305 w=100 (но П-469 похоже только верхняя часть)
    К-270 x=405 w=50
    К-267 x=455 w=50
    К-239 x=505 w=50
    К-791 x=555 w=50
    К-271 x=605 w=50
    К-610 x=655 w=50
    К-609 x=705 w=50
    К-293 x=755 w=50
    К-292 x=805 w=50

    НИЖНИЙ РЯД:
    Стопка 4шт+метки x=5 w=100:
      К-326 h=31
      К-325 h=31
      К-324 h=31
      метка 114|58: два блока по 50px w=50 каждый, h=32
    К-323 x=105 w=50
    К-322 x=155 w=50
    К-321 x=205 w=50
    К-320 x=255 w=50
    К-319 x=305 w=50
    К-318 x=355 w=50
    К-317 x=405 w=50
    К-316 x=455 w=50
    К-315 x=505 w=50
    К-314 x=555 w=50
    К-313 x=605 w=50
    К-312 x=655 w=50
    К-311 x=705 w=50
    К-310 x=755 w=50
    К-309 x=805 w=50
    К-308 x=855 w=50 → итого до 905
  -->

  <rect width="915" height="310" fill="#DAE5DF"/>

  <!-- ══════════════════════════
       ВЕРХНИЙ РЯД y=20, h=125
  ══════════════════════════ -->

  <!-- Стопка 3шт: П-559 / К-328 / К-327 -->
  <rect x="5"   y="20"  width="100" height="42" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="41"  font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-559</text>

  <rect x="5"   y="62"  width="100" height="41" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="82"  font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-328</text>

  <rect x="5"   y="103" width="100" height="42" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="124" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-327</text>

  <!-- П-471: 4кл=100 -->
  <rect x="105" y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="155" y="82"  font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-471</text>

