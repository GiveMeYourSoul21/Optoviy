<svg width="115" height="1490" viewBox="0 0 115 1490" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!--
    1 кл = 25px
    Это вертикальная схема — один столбец секций

    Туалет: x=5, w=100 (4кл), h=125 (5кл) — горизонт текст
    П-417:  x=5, w=50  (2кл), h=125 (5кл) — вертик текст
    П-422:  x=5, w=50  (2кл), h=100 (4кл) — вертик
    П-423..П-426: x=5, w=50, h=50  (2кл) — горизонт
    П-427:  x=5, w=50, h=100 (4кл) — вертик
    П-428:  x=5, w=50, h=50  (2кл) — горизонт
    П-429:  x=5, w=50, h=100 (4кл) — вертик
    П-430:  x=5, w=50, h=125 (5кл) — вертик
    П-444:  x=5, w=50, h=50  (2кл) — горизонт
    П-431..П-434: x=5, w=50, h=50 — горизонт
    П-435:  x=5, w=50, h=75  (3кл) — вертик
    П-2:    x=5, w=100(4кл), h=125(5кл) — горизонт
    К-720..К-815: x=55, w=50, h=50 — горизонт (правая колонка внутри П-2 и ниже)
  -->

  <rect width="115" height="1490" fill="#DAE5DF"/>

  <!-- Туалет: 4кл×5кл = 100×125 -->
  <rect x="5"  y="20"  width="100" height="125" fill="#d8eee4" stroke="#a8c8b4" stroke-width="1.5"/>
  <text x="55" y="82"  font-size="12" fill="#1a3a2a" text-anchor="middle" dominant-baseline="middle">Туалет</text>

  <!-- П-417: 2кл×5кл = 50×125, вертик текст -->
  <rect x="5"  y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30 207)">П-417</text>

  <!-- П-422: 2кл×4кл = 50×100, вертик текст -->
  <rect x="5"  y="270" width="50" height="100" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="320" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30 320)">П-422</text>

  <!-- П-423: 2кл×2кл = 50×50, горизонт текст -->
  <rect x="5"  y="370" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="395" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-423</text>

  <!-- П-424 -->
  <rect x="5"  y="420" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="445" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-424</text>

  <!-- П-425 -->
  <rect x="5"  y="470" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="495" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-425</text>

  <!-- П-426 -->
  <rect x="5"  y="520" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="545" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-426</text>

  <!-- П-427: 2кл×4кл = 50×100, вертик текст -->
  <rect x="5"  y="570" width="50" height="100" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="620" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30 620)">П-427</text>

  <!-- П-428: 50×50 горизонт -->
  <rect x="5"  y="670" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="695" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-428</text>

  <!-- П-429: 2кл×4кл = 50×100, вертик текст -->
  <rect x="5"  y="720" width="50" height="100" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="770" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30 770)">П-429</text>

  <!-- П-430: 2кл×5кл = 50×125, вертик текст -->
  <rect x="5"  y="820" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="882" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30 882)">П-430</text>

  <!-- П-444: 50×50 горизонт -->
  <rect x="5"  y="945" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="970" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-444</text>

  <!-- П-431 -->
  <rect x="5"  y="995"  width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="1020" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-431</text>

  <!-- П-432 -->
  <rect x="5"  y="1045" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="1070" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-432</text>

  <!-- П-433 -->
  <rect x="5"  y="1095" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="1120" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-433</text>

  <!-- П-434 -->
  <rect x="5"  y="1145" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="1170" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-434</text>

  <!-- П-435: 2кл×3кл = 50×75, вертик текст -->
  <rect x="5"  y="1195" width="50" height="75" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="1232" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30 1232)">П-435</text>

  <!-- П-2: 4кл×5кл = 100×125, горизонт текст (левая часть) -->
  <rect x="5"  y="1270" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="1332" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-2</text>

  <!-- К-720..К-815: правая колонка x=55, w=50, h=50 каждый -->
  <rect x="55" y="1270" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="80" y="1295" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-720</text>

  <rect x="55" y="1320" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="80" y="1345" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-715</text>

  <rect x="55" y="1370" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="80" y="1395" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-723</text>

  <rect x="55" y="1420" width="50" height="50" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="80" y="1445" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-815</text>

</svg>