  <!-- П-88: 2кл=50 -->
  <rect x="1205" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="1230" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 1230 82)">П-88</text>

  <!-- П-196: 2кл=50 -->
  <rect x="1255" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="1280" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 1280 82)">П-196</text>

  <!-- П-89: 2кл=50 -->
  <rect x="1305" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="1330" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 1330 82)">П-89</text>

  <!-- П-90: 2кл=50 -->
  <rect x="1355" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="1380" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 1380 82)">П-90</text>

  <!-- П-91: 4кл=100 -->
  <rect x="1405" y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="1455" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-91</text>

  <!-- П-499: 2кл=50 -->
  <rect x="1505" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="1530" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 1530 82)">П-499</text>

</svg>