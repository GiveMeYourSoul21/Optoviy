  <rect x="1005" y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="1055" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-85</text>

