<svg width="1600" height="200" viewBox="0 0 1600 200" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!--
    1 кл = 25px
    Стандарт: 2кл×5кл = 50×125
    Высота: 125px
    
    Левая метка КП/Контролёр: x=5, w=50 (вертикальная стопка 2шт)
    
    Ячейки (x-позиции, все 50px широкие):
    П-460  x=55   w=50
    П-461  x=105  w=100 (широкая 4кл)
    П-450  x=205  w=50
    П-451  x=255  w=100
    П-75   x=355  w=100
    П-76   x=455  w=100
    П-78   x=555  w=100
    П-79   x=655  w=100
    П-80   x=755  w=50
    П-81   x=805  w=50
    П-82   x=855  w=50
    П-83   x=905  w=50
    П-84   x=955  w=50
    П-85   x=1005 w=100
    П-86   x=1105 w=50
    П-87   x=1155 w=50
    П-88   x=1205 w=50
    П-196  x=1255 w=50
    П-89   x=1305 w=50
    П-90   x=1355 w=50
    П-91   x=1405 w=100
    П-499  x=1505 w=50
    
    Итого до: 1555px → viewBox 1600
  -->

  <rect width="1600" height="200" fill="#DAE5DF"/>

  <!-- ══════════════════════════════
       ЛЕВАЯ МЕТКА: КП / Контролёр
       x=5, w=50, стопка 2шт
  ══════════════════════════════ -->

  <rect x="5"  y="20" width="50" height="62" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="51" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">КП</text>

  <rect x="5"  y="82" width="50" height="63" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30" y="113" font-size="9" fill="#29332D" text-anchor="middle" dominant-baseline="middle">Контролёр</text>

  <!-- ══════════════════════════════
       ОСНОВНОЙ РЯД y=20, h=125
  ══════════════════════════════ -->

  <!-- П-460: 2кл=50 -->
  <rect x="55"   y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="80"   y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 80 82)">П-460</text>

  <!-- П-461: 4кл=100 -->
  <rect x="105"  y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="155"  y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-461</text>

  <!-- П-450: 2кл=50 -->
  <rect x="205"  y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="230"  y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 230 82)">П-450</text>

  <!-- П-451: 4кл=100 -->
  <rect x="255"  y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="305"  y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-451</text>

  <!-- П-75: 4кл=100 -->
  <rect x="355"  y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="405"  y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-75</text>

