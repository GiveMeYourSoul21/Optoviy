  <rect x="5"   y="145" width="100" height="62" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="176" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-424</text>

