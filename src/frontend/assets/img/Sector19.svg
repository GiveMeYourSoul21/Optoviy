<svg width="1010" height="310" viewBox="0 0 1010 310" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!--
    1 кл = 25px
    Стандарт верт: 2кл×5кл = 50×125
    Широкий 4кл: 100×125
    Широкий 6кл: 150×125

    Высота ряда = 5кл = 125px
    Общая высота = 2 ряда × 125 = 250px + отступы

    АНАЛИЗ СКРИНА:
    Левый блок — 3 горизонтальных ячейки сверху (К-421, К-422, К-423) ш=100, каждая h=125/3≈42
    Левый блок — 2 горизонтальных снизу (К-424, К-425) ш=100, каждая h=125/2=62-63
    К-407 — вертикальный, верхний ряд только 50×125
    К-409 — вертикальный, нижний ряд только 50×125

    ВЕРХНИЙ РЯД (y=20, h=125):
      К-421/К-422/К-423 стопка x=5   w=100 (3 части)
      К-407             x=105  w=50  h=125 вертикальный
      П-476             x=155  w=100 h=125
      П-475             x=255  w=150 h=125  (6кл)
      К-814             x=405  w=50  h=125
      К-374             x=455  w=50  h=125
      П-474             x=505  w=100 h=125
      П-473             x=605  w=100 h=125
      П-472             x=705  w=100 h=125
      К-399             x=805  w=50  h=125
      П-483             x=855  w=100 h=125

    НИЖНИЙ РЯД (y=145, h=125):
      К-424/К-425 стопка x=5   w=100 (2 части)
      К-409             x=105  w=50  h=125 вертикальный
      К-492             x=155  w=50  h=125
      К-412             x=205  w=50  h=125
      К-394             x=255  w=50  h=125
      К-395             x=305  w=50  h=125
      К-396             x=355  w=50  h=125
      К-398             x=405  w=50  h=125
      К-354             x=455  w=50  h=125
      К-355             x=505  w=50  h=125
      К-351             x=555  w=50  h=125
      К-352             x=605  w=50  h=125
      К-353             x=655  w=50  h=125
      К-337             x=705  w=50  h=125
      К-349             x=755  w=50  h=125
      К-347             x=805  w=50  h=125
      К-369/К-368/К-367 стопка x=855 w=100 (3 части)
      кп                x=855  w=100 (подпись внизу)
  -->

  <rect width="1010" height="310" fill="#DAE5DF"/>

  <!-- ══════════════════════════════
       ВЕРХНИЙ РЯД  y=20, h=125
  ══════════════════════════════ -->

  <!-- К-421 / К-422 / К-423 — стопка из 3, x=5, w=100 -->
  <rect x="5"   y="20"  width="100" height="42" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="41"  font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-421</text>

  <rect x="5"   y="62"  width="100" height="41" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="82"  font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-422</text>

  <rect x="5"   y="103" width="100" height="42" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="124" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-423</text>

  <!-- К-407: вертикальный 50×125 -->
  <rect x="105" y="20" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="130" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 130 82)">К-407</text>

  <!-- П-476: 100×125 -->
  <rect x="155" y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
