  <rect x="805" y="20" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="830" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 830 82)">К-399</text>

  <!-- П-483: 100×125 -->
  <rect x="855" y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="905" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-483</text>


