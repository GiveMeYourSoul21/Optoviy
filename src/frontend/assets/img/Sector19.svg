  <rect x="255" y="20" width="150" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="330" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-475</text>

  <!-- К-814: 50×125 -->
  <rect x="405" y="20" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="430" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 430 82)">К-814</text>

  <!-- К-374: 50×125 -->
  <rect x="455" y="20" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="480" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 480 82)">К-374</text>

  <!-- П-474: 100×125 -->
  <rect x="505" y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="555" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-474</text>

  <!-- П-473: 100×125 -->
  <rect x="605" y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="655" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-473</text>

  <!-- П-472: 100×125 -->
  <rect x="705" y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="755" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-472</text>

