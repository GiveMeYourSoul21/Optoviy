  <rect x="755" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="780" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 780 207)">К-349</text>

  <!-- К-347 -->
  <rect x="805" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="830" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 830 207)">К-347</text>

  <!-- К-369 / К-368 / К-367 — стопка из 3, x=855, w=100 -->
  <rect x="855" y="145" width="100" height="42" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="905" y="166" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">К-369</text>

  <rect x="855" y="187" width="100" height="41" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
