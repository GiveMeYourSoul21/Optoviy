<svg width="1060" height="280" viewBox="0 0 1060 280" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!--
    Масштаб: 1м = 20px
    Секция: 2.5м = 50px ширина, 6м = 120px высота
    Нижний ряд: 21 секция × 50px = 1050px  +  отступы 5px = 1060px
    Верхние надстройки: те же 50px, высота тоже 120px
    Верхний ряд начинается y=20, нижний y=140+20=160
    Итого высота: 20 + 120(верх) + 20(зазор) + 120(низ) + 20 = 300 → но верхние не над всеми
    SVG height = 20 + 120 + 0 + 120 + 20 = 280px
  -->

  <!-- ФОН -->
  <rect width="1060" height="280" fill="#DAE5DF"/>

  <!-- ══════════════════════════════════════════
       ВЕРХНИЕ НАДСТРОЙКИ (y=20, h=120)
       Только над позициями: K-702, K-701, 698, K-697, K-695, K-696
       
       Позиция K-702 в нижнем ряду = 13-я слева (индекс 13, x = 5+13×50 = 655)
       Позиция K-701 = 14-я (x=705)
       Позиция 698   = 17-я (x=855)
       Позиция K-697 = 18-я (x=905)
       Позиция K-695 = 19-я (x=955)
       Позиция K-696 = 20-я (x=1005)
       
       Отступ слева = 5px
       Порядок: K-757(0) K-756(1) 755(2) 740(3) K-744(4) K-745(5)
                K-709(6) K-708(7) K-707(8) 706(9) 705(10) K-704(11)
                K-703(12) K-702(13) K-701(14) K-649(15) 699(16)
                698(17) K-697(18) K-695(19) K-696(20)
  ══════════════════════════════════════════ -->

  <!-- K-230 над K-702 (x = 5+13×50 = 655) -->
  <rect x="655" y="20" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="680" y="80" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 680 80)">К-230</text>

  <!-- K-226 над K-701 (x=705) -->
  <rect x="705" y="20" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="730" y="80" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 730 80)">К-226</text>

  <!-- K-266 над 698 (x = 5+17×50 = 855) -->
  <rect x="855" y="20" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="880" y="80" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 880 80)">К-266</text>

  <!-- K-803 над K-697 (x=905) -->
  <rect x="905" y="20" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="930" y="80" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 930 80)">К-803</text>

  <!-- 548 над K-695 (x=955) -->
  <rect x="955" y="20" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="980" y="80" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 980 80)">548</text>

  <!-- 547 над K-696 (x=1005) -->
  <rect x="1005" y="20" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="1030" y="80" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 1030 80)">547</text>

  <!-- ══════════════════════════════════════════
       НИЖНИЙ РЯД (y=140, h=120)
       21 секция × 50px, x начало = 5
  ══════════════════════════════════════════ -->

  <!-- K-757  x=5 -->
  <rect x="5"   y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30"  y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30 200)">К-757</text>

  <!-- K-756  x=55 -->
  <rect x="55"  y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="80"  y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 80 200)">К-756</text>

  <!-- 755  x=105 -->
