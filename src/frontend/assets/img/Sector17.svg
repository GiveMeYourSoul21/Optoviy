  <text x="280" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 280 200)">К-745</text>

  <!-- K-709  x=305 -->
  <rect x="305" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="330" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 330 200)">К-709</text>

  <!-- K-708  x=355 -->
  <rect x="355" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="380" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 380 200)">К-708</text>

  <!-- K-707  x=405 -->
  <rect x="405" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="430" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 430 200)">К-707</text>

