  <rect x="455" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="480" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 480 200)">706</text>

  <!-- 705  x=505 -->
  <rect x="505" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="530" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 530 200)">705</text>

  <!-- K-704  x=555 -->
  <rect x="555" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="580" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 580 200)">К-704</text>

  <!-- K-703  x=605 -->
  <rect x="605" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="630" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 630 200)">К-703</text>

  <!-- K-702  x=655 (с верхней надстройкой) -->
  <rect x="655" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="680" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 680 200)">К-702</text>

  <!-- K-701  x=705 (с верхней надстройкой) -->
  <rect x="705" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="730" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 730 200)">К-701</text>

  <!-- K-649  x=755 -->
  <rect x="755" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="780" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 780 200)">К-649</text>

  <!-- 699  x=805 -->
  <rect x="805" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="830" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 830 200)">699</text>

  <!-- 698  x=855 (с верхней надстройкой) -->
  <rect x="855" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="880" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 880 200)">698</text>

  <!-- K-697  x=905 (с верхней надстройкой) -->
  <rect x="905" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="930" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 930 200)">К-697</text>

  <!-- K-695  x=955 (с верхней надстройкой) -->
  <rect x="955" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="980" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 980 200)">К-695</text>

  <!-- K-696  x=1005 (с верхней надстройкой) -->
  <rect x="1005" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="1030" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 1030 200)">К-696</text>

</svg>