  <text x="180" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 180 200)">740</text>

  <!-- K-744  x=205 -->
  <rect x="205" y="140" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="230" y="200" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 230 200)">К-744</text>

