    Все выровнены снизу: нижний край = 140px
    Ширина каждой: 2.5м = 50px
  -->

  <rect width="1330" height="160" fill="#DAE5DF"/>

  <!-- ══════════════════ ВЫСОКИЕ 6м=120px  y=20 ══════════════════ -->

  <rect x="5"   y="20" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30"  y="80" font-size="12" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30 80)">К-95</text>

  <rect x="55"  y="20" width="50" height="120" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
