<svg width="1330" height="160" viewBox="0 0 1330 160" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!--
    Масштаб: 1м = 20px
    Высокие (6м = 120px): К-95, К-438, 461, 460  →  y=20, h=120
