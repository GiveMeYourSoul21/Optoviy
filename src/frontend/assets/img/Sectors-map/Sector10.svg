<svg width="230" height="470" viewBox="0 0 230 470" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!--
    1 кл = 25px
    Стандарт: 4кл×2кл = 100×50
    Двойной: 4кл×4кл = 100×100
    Вертикальный: 4кл×2кл = 100×50 (но текст ротированный)

    Левая колонка:  x=5,   w=100
    Правая колонка: x=105, w=100

    СТРОКИ (y-позиции):
    y=20:  П-384(h=100, левая) | П-389(h=50, правая) + П-390(h=50, правая)
    y=120: П-385(h=50, левая)  | П-391(h=50, правая)
    y=170: П-386(h=50, левая)  | П-392(h=50, правая)
    y=220: П-387(h=100, левая) | П-393(h=50, правая) + П-394(h=100, правая — ↓y=270)
    y=320: П-388(h=50, левая)  | П-394 продолжается до y=370
    y=370: П-541(h=50, левая)  | П-542(h=50, правая)
    Итого высота: 20+350+50+50 = 470
  -->

  <rect width="230" height="470" fill="#DAE5DF"/>

  <!-- ══════════════════════
       ЛЕВАЯ КОЛОНКА x=5, w=100
  ══════════════════════ -->

  <!-- П-384: h=100 (двойной — 4кл высота) -->
  <rect x="5"   y="20"  width="100" height="100" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="70"  font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 55 70)">П-384</text>

  <!-- П-385: h=50 -->
  <rect x="5"   y="120" width="100" height="50"  fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="145" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-385</text>

  <!-- П-386: h=50 -->
  <rect x="5"   y="170" width="100" height="50"  fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="195" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-386</text>

  <!-- П-387: h=100 (двойной) -->
  <rect x="5"   y="220" width="100" height="100" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="270" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 55 270)">П-387</text>

  <!-- П-388: h=50 -->
  <rect x="5"   y="320" width="100" height="50"  fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="345" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-388</text>

  <!-- П-541: h=50 -->
  <rect x="5"   y="370" width="100" height="50"  fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="55"  y="395" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-541</text>


  <!-- ══════════════════════
       ПРАВАЯ КОЛОНКА x=105, w=100
  ══════════════════════ -->

  <!-- П-389: h=50 -->
  <rect x="105" y="20"  width="100" height="50"  fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="155" y="45"  font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-389</text>

  <!-- П-390: h=50 -->
  <rect x="105" y="70"  width="100" height="50"  fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="155" y="95"  font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-390</text>

  <!-- П-391: h=50 -->
  <rect x="105" y="120" width="100" height="50"  fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="155" y="145" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-391</text>

  <!-- П-392: h=50 -->
  <rect x="105" y="170" width="100" height="50"  fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="155" y="195" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-392</text>

  <!-- П-393: h=50 -->
  <rect x="105" y="220" width="100" height="50"  fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="155" y="245" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-393</text>

  <!-- П-394: h=100 (двойной — занимает y=270..370) -->
  <rect x="105" y="270" width="100" height="100" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="155" y="320" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 155 320)">П-394</text>

  <!-- П-542: h=50 -->
  <rect x="105" y="370" width="100" height="50"  fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="155" y="395" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-542</text>

</svg>