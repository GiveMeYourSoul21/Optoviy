<svg width="870" height="275" viewBox="0 0 870 275" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!--
    1 кл = 25px
    Вертикальная: 2кл×5кл = 50×125
    Широкая 4кл: 100×125
    Широкая 6кл: 150×125  ← П-494
    Ряды вплотную:
      Верхний ряд: y=20,  h=125  → нижний край y=145
      Нижний ряд:  y=145, h=125  → нижний край y=270
    Пав-маг.485: x=755, y=20, w=200, h=250 (оба ряда)

    ВЕРХНИЙ РЯД x-позиции:
    К-667  x=5   w=50
    К-437  x=55  w=50
    К-94   x=105 w=50
    К-617  x=155 w=50
    П-498  x=205 w=100
    П-497  x=305 w=100
    К-102  x=405 w=50
    К-605  x=455 w=50
    П-496  x=505 w=50
    П-495  x=555 w=50
    П-494  x=605 w=150  ← 6кл=150px
    Пав-маг.485 x=755 w=200 (двухрядный)

    НИЖНИЙ РЯД x-позиции:
    К-499..К-448: 15 × 50px → x=5..755
    Пав-маг.485: x=755 (общий блок)
  -->

  <rect width="870" height="275" fill="#DAE5DF"/>

  <!-- ══════════════════════════════
       ВЕРХНИЙ РЯД  y=20, h=125
  ══════════════════════════════ -->

  <rect x="5"   y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30"  y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30 82)">К-667</text>

  <rect x="55"  y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="80"  y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 80 82)">К-437</text>

  <rect x="105" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="130" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 130 82)">К-94</text>

  <rect x="155" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="180" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 180 82)">К-617</text>

  <rect x="205" y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="255" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-498</text>

  <rect x="305" y="20" width="100" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="355" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-497</text>

  <rect x="405" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="430" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 430 82)">К-102</text>

  <rect x="455" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="480" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 480 82)">К-605</text>

  <rect x="505" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="530" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 530 82)">П-496</text>

  <rect x="555" y="20" width="50"  height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="580" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 580 82)">П-495</text>

  <!-- П-494: 6кл×5кл = 150×125 -->
  <rect x="605" y="20" width="150" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="680" y="82" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle">П-494</text>


  <!-- ══════════════════════════════
       НИЖНИЙ РЯД  y=145, h=125
  ══════════════════════════════ -->

  <rect x="5"   y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="30"  y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 30 207)">К-499</text>

  <rect x="55"  y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="80"  y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 80 207)">К-498</text>

  <rect x="105" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="130" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 130 207)">К-497</text>

  <rect x="155" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="180" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 180 207)">К-496</text>

  <rect x="205" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="230" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 230 207)">К-495</text>

  <rect x="255" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="280" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 280 207)">К-488</text>

  <rect x="305" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="330" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 330 207)">К-487</text>

  <rect x="355" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="380" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 380 207)">К-486</text>

  <rect x="405" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="430" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 430 207)">К-485</text>

  <rect x="455" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="480" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 480 207)">К-484</text>

  <rect x="505" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="530" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 530 207)">К-483</text>

  <rect x="555" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="580" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 580 207)">К-489</text>

  <rect x="605" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="630" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 630 207)">К-451</text>

  <rect x="655" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="680" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 680 207)">К-433</text>

  <rect x="705" y="145" width="50" height="125" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="730" y="207" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 730 207)">К-448</text>


  <!-- ══════════════════════════════
       ПАВ-МАГ. 485 — двухрядный блок
       x=755, y=20, w=200, h=250
  ══════════════════════════════ -->
  <rect x="755" y="20" width="100" height="250" fill="#FAE9C8" stroke="#c8b898" stroke-width="1.5"/>
  <text x="805" y="145" font-size="11" fill="#29332D" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 805 145)">Пав-маг. 485</text>

</svg>