<svg width="830" height="290" viewBox="0 0 830 290" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!--
    1 кл = 25px
    Стандарт: 2кл×5кл = 50×125
    Широкий 4кл: 100×125
    Метка: 1кл×5кл = 25×125
    Ряды вплотную:
      Верхний ряд: y=20, h=125
      Нижний ряд:  y=145, h=125

    ВЕРХНИЙ РЯД:
    П   x=5   w=25  (метка)
    К-99  x=30  w=50
    К-98  x=80  w=50
    К-97  x=130 w=50
    К-96  x=180 w=50
    П-502 x=230 w=100
    К-92  x=330 w=50
    К-89  x=380 w=50
    К-91  x=430 w=50
    К-90  x=480 w=50
    П-501 x=530 w=100
    К-87  x=630 w=50
    К-86  x=680 w=50
    К-85  x=730 w=50
    К-84  x=780 w=50
    Итого: 5+25+50×4+100+50×4+100+50×4 = 5+25+200+100+200+100+200 = 830

    НИЖНИЙ РЯД:
    3     x=5   w=25  (метка)
    К-259 x=30  w=50
    К-258 x=80  w=50
    К-257 x=130 w=50
    К-256 x=180 w=50
    К-255 x=230 w=50
    К-254 x=280 w=50
    К-253 x=330 w=50
    К-252 x=380 w=50
    К-251 x=430 w=50
    К-250 x=480 w=50
    К-356 x=530 w=50
    К-357 x=580 w=50
    К-247 x=630 w=50
    К-246 x=680 w=50
    К-245 x=730 w=50
    К-643 x=780 w=50
    Итого: 5+25+50×16 = 5+25+800 = 830
  -->

  <rect width="835" height="290" fill="#DAE5DF"/>

